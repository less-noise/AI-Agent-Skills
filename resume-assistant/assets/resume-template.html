<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{NAME}} - Resume</title>
  <style>
    @page { size: A4; margin: 16mm 20mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 210mm;
      color: #111;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      font-size: 10.5pt;
      line-height: 1.25;
    }
    header {
      border-bottom: 1.5px solid #1a3a5c;
      margin-bottom: 10px;
      padding-bottom: 8px;
    }
    h1 {
      margin: 0 0 6px;
      color: #1a3a5c;
      font-size: 21pt;
    }
    h2 {
      margin: 12px 0 6px;
      border-bottom: 1px solid #d6dde5;
      color: #1a3a5c;
      font-size: 12.5pt;
    }
    p { margin: 4px 0; }
    ul { margin: 4px 0 8px 18px; padding: 0; }
    li { margin: 2px 0; }
    .contact, .muted { color: #444; }
    .entry { margin-bottom: 7px; }
    .entry-head {
      display: flex;
      gap: 12px;
      justify-content: space-between;
    }
    .entry-head span {
      color: #444;
      white-space: nowrap;
    }
    @media print { body { max-width: none; } }
  </style>
</head>
<body>
  <header>
    <h1>{{NAME}}</h1>
    <div class="contact">{{CONTACT}}</div>
  </header>
  {{CONTENT}}
</body>
</html>
